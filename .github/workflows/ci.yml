name: ci

# The eight required checks. Every job always runs, so branch protection never waits for a check that a path filter
# skipped. A job whose code doesn't exist yet passes as "not applicable"; the pull request that adds the code also
# makes the job real.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Lint workflows (actionlint)
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color
      - name: Lint shell scripts (shellcheck)
        run: |
          mapfile -t scripts < <(git ls-files '*.sh')
          if ((${#scripts[@]})); then shellcheck "${scripts[@]}"; else echo "No shell scripts."; fi

  domain-tests:
    name: domain-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: echo "::notice title=Not applicable yet::No backend yet. The services PR makes this check real."

  data-integration:
    name: data-integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - run: echo "::notice title=Not applicable yet::No data layer yet. The data model PR makes this check real."

  api-contract:
    name: api-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: echo "::notice title=Not applicable yet::No API contract yet. The search PR makes this check real."

  ui-smoke-accessibility:
    name: ui-smoke-accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        working-directory: apps/web
        run: npm ci
      - name: Unit and accessibility tests (Vitest)
        working-directory: apps/web
        run: npx ng test --watch=false
      - name: Production build
        working-directory: apps/web
        run: npx ng build

  helm-policy:
    name: helm-policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: echo "::notice title=Not applicable yet::No Helm chart yet. The deploy PR makes this check real."

  incident-scope:
    name: incident-scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Incident PRs change only the allowed fields (OPS-1)
        env:
          IS_INCIDENT: ${{ github.event_name == 'pull_request' && (contains(github.event.pull_request.labels.*.name, 'incident') || github.event.pull_request.user.login == 'dash0-app[bot]') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: ./scripts/check-incident-scope.sh

  build-images:
    name: build-images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build the web image
        run: docker build --tag "conferenceops-web:${GITHUB_SHA}" apps/web
      - name: The web image runs as non-root and serves the app and its config
        run: |
          docker run --rm -d --name web -p 8081:8080 -e CORE_UPSTREAM=core.invalid:80 -e DISCOVERY_UPSTREAM=discovery.invalid:80 "conferenceops-web:${GITHUB_SHA}"
          for _ in $(seq 1 20); do curl -sf localhost:8081/health/ready && break; sleep 1; done
          curl -sf localhost:8081/health/ready || { docker logs web; exit 1; }
          curl -sf localhost:8081/ | grep -q "<app-root"
          curl -sf localhost:8081/config.json | python3 -c "import json,sys; c=json.load(sys.stdin); assert c['dash0Dataset']=='conferenceops'"
          test "$(docker exec web id -u)" != 0
          # An API name that doesn't resolve fails only that request (502); nginx keeps serving.
          test "$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 -X POST localhost:8081/api/v1/search)" = 502 || { docker logs web; exit 1; }
          curl -sf localhost:8081/health/ready
          docker rm -f web
