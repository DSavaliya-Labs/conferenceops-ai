name: ci

# The eight required checks. Every job always runs, so branch protection never waits for a check that a path filter
# skipped. A job whose code doesn't exist yet passes as "not applicable"; the pull request that adds the code also
# makes the job real.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Lint workflows (actionlint)
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color
      - name: Lint shell scripts (shellcheck)
        run: |
          mapfile -t scripts < <(git ls-files '*.sh')
          if ((${#scripts[@]})); then shellcheck "${scripts[@]}"; else echo "No shell scripts."; fi
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/0.13.7/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Lint and format-check Python (ruff)
        working-directory: backend
        run: |
          uv sync --frozen --python 3.12
          uv run ruff check .
          uv run ruff format --check .

  domain-tests:
    name: domain-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/0.13.7/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Unit tests (no PostgreSQL, Elasticsearch or OpenAI)
        working-directory: backend
        run: |
          uv sync --frozen --python 3.12
          uv run pytest -q

  data-integration:
    name: data-integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: co
          POSTGRES_PASSWORD: co
          POSTGRES_DB: conferenceops
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U co" --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      DATABASE_URL: postgresql+psycopg://co:co@localhost:5432/conferenceops
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/0.13.7/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Migrations apply to an empty database
        working-directory: backend
        run: |
          uv sync --frozen --python 3.12
          uv run alembic upgrade head
      - name: Integration tests (real PostgreSQL)
        working-directory: backend
        run: uv run pytest -q -m integration

  api-contract:
    name: api-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/0.13.7/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: The committed OpenAPI schema matches the code (API-1)
        working-directory: backend
        run: |
          uv sync --frozen --python 3.12
          uv run python -m conferenceops.export_openapi > /tmp/openapi.json
          diff -u ../contracts/openapi.json /tmp/openapi.json || { echo "::error::Regenerate contracts/openapi.json"; exit 1; }
      - name: The generated TypeScript types match the schema (API-1)
        run: |
          npx --yes openapi-typescript@7.4.4 contracts/openapi.json -o /tmp/api.d.ts
          diff -u contracts/api.d.ts /tmp/api.d.ts || { echo "::error::Regenerate contracts/api.d.ts"; exit 1; }

  ui-smoke-accessibility:
    name: ui-smoke-accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        working-directory: apps/web
        run: npm ci
      - name: Unit and accessibility tests (Vitest)
        working-directory: apps/web
        run: npx ng test --watch=false
      - name: Production build
        working-directory: apps/web
        run: npx ng build

  helm-policy:
    name: helm-policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install kubeconform
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz \
            | tar xz -C "$HOME/bin" kubeconform
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Lint, render and validate the chart with the AKS values
        run: |
          helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts --force-update >/dev/null
          helm dependency build deploy/chart
          args=(-f deploy/env/aks/values.yaml --set image.repository=example.azurecr.io/conferenceops-backend --set image.tag=ci
            --set web.image.repository=example.azurecr.io/conferenceops-web --set web.image.tag=ci)
          helm lint deploy/chart "${args[@]}"
          helm template conferenceops deploy/chart "${args[@]}" \
            | kubeconform -strict -summary -ignore-missing-schemas
      - name: Discovery replicas outside the bounds must not render (OPS-1)
        run: |
          out=$(helm template conferenceops deploy/chart -f deploy/env/aks/values.yaml --set image.repository=x \
            --set image.tag=ci --set web.image.repository=x --set web.image.tag=ci \
            --set components.discovery.replicas=9 2>&1) && { echo "::error::rendered"; exit 1; }
          grep -q 'outside 1..5 (OPS-1)' <<<"$out" || { echo "::error::failed for another reason: $out"; exit 1; }
      - name: A latest image tag must not render, backend or web (K8S-1)
        run: |
          images=(--set image.repository=x --set image.tag=ci --set web.image.repository=x --set web.image.tag=ci)
          for tag in image.tag web.image.tag; do
            out=$(helm template conferenceops deploy/chart "${images[@]}" --set "$tag=latest" 2>&1) \
              && { echo "::error::$tag=latest rendered"; exit 1; }
            grep -qF " $tag must not be latest (K8S-1)" <<<"$out" || { echo "::error::failed for another reason: $out"; exit 1; }
          done

  incident-scope:
    name: incident-scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Incident PRs change only the allowed fields (OPS-1)
        env:
          IS_INCIDENT: ${{ github.event_name == 'pull_request' && (contains(github.event.pull_request.labels.*.name, 'incident') || github.event.pull_request.user.login == 'dash0-app[bot]') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: ./scripts/check-incident-scope.sh

  build-images:
    name: build-images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build the backend image (pushed by the deploy workflow, not here)
        run: docker build --tag "conferenceops-backend:${GITHUB_SHA}" backend
      - name: The image runs as non-root and answers its health check
        run: |
          docker run --rm -d --name core -p 8080:8080 "conferenceops-backend:${GITHUB_SHA}"
          for _ in $(seq 1 20); do curl -sf localhost:8080/health/ready && break; sleep 1; done
          curl -sf localhost:8080/health/ready || { docker logs core; exit 1; }
          test "$(docker exec core id -u)" = 10001
          docker rm -f core
      - name: Build the web image
        run: docker build --tag "conferenceops-web:${GITHUB_SHA}" apps/web
      - name: The web image runs as non-root and serves the app and its config
        run: |
          # As the chart runs it (K8S-1): user 101, no capabilities, and a read-only root filesystem where only the
          # chart's emptyDir paths are writable: conf.d for the config the entrypoint renders, /tmp for the pid and temp
          # files. An emptyDir is world-writable (0777); a plain --tmpfs can come up with the image directory's mode
          # (0775, owned by root), which user 101 can't write. No --rm, so `docker logs` shows why nginx stopped.
          docker run -d --name web -p 8081:8080 --user 101:101 --read-only \
            --tmpfs /etc/nginx/conf.d:mode=0777 --tmpfs /tmp:mode=0777 --cap-drop ALL --security-opt no-new-privileges \
            -e CORE_UPSTREAM=core.invalid:80 -e DISCOVERY_UPSTREAM=discovery.invalid:80 "conferenceops-web:${GITHUB_SHA}"
          for _ in $(seq 1 20); do curl -sf localhost:8081/health/ready && break; sleep 1; done
          curl -sf localhost:8081/health/ready || { docker logs web; exit 1; }
          curl -sf localhost:8081/ | grep -q "<app-root"
          curl -sf localhost:8081/config.json | python3 -c "import json,sys; c=json.load(sys.stdin); assert c['dash0Dataset']=='conferenceops'"
          test "$(docker exec web id -u)" != 0
          # An API name that doesn't resolve fails only that request (502); nginx keeps serving.
          test "$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 -X POST localhost:8081/api/v1/search)" = 502 || { docker logs web; exit 1; }
          curl -sf localhost:8081/health/ready
          docker rm -f web
