name: deploy

# Every merge to main: build the backend and web images, deploy the chart to AKS, check what the public URL serves (the
# app, its config and a search through the proxy), and mark the deploy in Dash0, succeeded or failed.
# Azure sign-in is OIDC (scripts/azure-setup.sh): the identity trusts only this repository's `aks` environment, and
# only `main` can deploy to it, so no Azure secret exists to leak or rotate.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# One deploy at a time: a newer merge waits instead of cancelling a rollout halfway.
concurrency:
  group: deploy-aks
  cancel-in-progress: false

env:
  NAMESPACE: conferenceops
  RELEASE: conferenceops
  PUBLIC_URL: http://conferenceops-ai.westus3.cloudapp.azure.com

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: aks
      url: ${{ env.PUBLIC_URL }}
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: ${{ vars.ACR_NAME }}.azurecr.io/conferenceops-backend
      WEB_IMAGE: ${{ vars.ACR_NAME }}.azurecr.io/conferenceops-web
      TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Installed first, so the failure marker at the end can be sent whichever step fails.
      - name: Install the Dash0 CLI
        uses: dash0hq/dash0-cli/.github/actions/setup@v1.1.0

      - name: Sign in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push the images (backend and web)
        run: |
          az acr login --name "${{ vars.ACR_NAME }}"
          docker build --tag "$IMAGE:$TAG" backend
          docker push "$IMAGE:$TAG"
          docker build --tag "$WEB_IMAGE:$TAG" apps/web
          docker push "$WEB_IMAGE:$TAG"

      - name: Cluster credentials (Entra ID through kubelogin)
        run: |
          az aks install-cli --install-location "$HOME/bin/kubectl" --kubelogin-install-location "$HOME/bin/kubelogin"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          az aks get-credentials --resource-group "${{ vars.AKS_RESOURCE_GROUP }}" --name "${{ vars.AKS_NAME }}" \
            --subscription "${{ vars.AZURE_SUBSCRIPTION_ID }}" --overwrite-existing
          "$HOME/bin/kubelogin" convert-kubeconfig -l azurecli

      - name: Platform (ECK operator, namespace)
        run: ./scripts/platform-up.sh

      - name: Secrets (created from the environment's secrets, never printed)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DASH0_INGEST_TOKEN: ${{ secrets.DASH0_INGEST_TOKEN }}
          DASH0_BROWSER_TOKEN: ${{ secrets.DASH0_BROWSER_TOKEN }}
        run: |
          kubectl -n "$NAMESPACE" create secret generic conferenceops-secrets \
            --from-literal=OPENAI_API_KEY="$OPENAI_API_KEY" \
            --from-literal=DASH0_INGEST_TOKEN="$DASH0_INGEST_TOKEN" \
            --from-literal=DASH0_BROWSER_TOKEN="$DASH0_BROWSER_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f - >/dev/null
          if ! kubectl -n "$NAMESPACE" get secret conferenceops-db >/dev/null 2>&1; then
            kubectl -n "$NAMESPACE" create secret generic conferenceops-db \
              --from-literal=password="$(openssl rand -hex 24)" >/dev/null
          fi

      - name: Deploy the chart
        run: |
          helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts --force-update >/dev/null
          helm dependency build deploy/chart
          # Server-side apply, and the chart wins conflicts on the fields it declares. The ECK operator writes the
          # whole Elasticsearch object back with an update (it adds an empty podTemplate.metadata), which makes it the
          # owner of .spec.nodeSets. Without --force-conflicts, every upgrade after the first fails on that field.
          helm upgrade --install "$RELEASE" deploy/chart --namespace "$NAMESPACE" --reset-values \
            -f deploy/env/aks/values.yaml --set image.repository="$IMAGE" --set image.tag="$TAG" \
            --set web.image.repository="$WEB_IMAGE" --set web.image.tag="$TAG" \
            --server-side=true --force-conflicts --wait --timeout 20m

      # The public LoadBalancer sends traffic to the web pods, and every node forwards it to a Ready one
      # (externalTrafficPolicy Cluster), so a rollout doesn't wait on Azure's health probe. When a deploy changes the
      # Service itself, Azure reconfigures the load balancer for a few seconds. So every request has a time limit, and
      # the checks are retried together for up to five minutes. A failure names the check that failed last.
      - name: The public URL answers
        run: |
          serves() {
            local page config search
            if ! curl -sf --max-time 10 "$PUBLIC_URL/health/ready" >/dev/null; then
              echo "/health/ready: not 200"; return 1
            fi
            if ! page=$(curl -sf --max-time 10 "$PUBLIC_URL/") || [[ $page != *"<app-root"* ]]; then
              echo "/: not the app"; return 1
            fi
            if ! config=$(curl -sf --max-time 10 "$PUBLIC_URL/config.json") \
              || ! jq -e '.dash0Dataset == "conferenceops"' <<<"$config" >/dev/null; then
              echo "/config.json: not the conferenceops dataset"; return 1
            fi
            # Browser monitoring (B4) starts only with the ingest-only browser token. The Secrets step writes an empty
            # value when the aks environment has no DASH0_BROWSER_TOKEN secret, and the app then runs unmonitored.
            # Checked by length; the token itself is never printed (SEC-1).
            if ! jq -e '.dash0Token | type == "string" and length > 0' <<<"$config" >/dev/null; then
              echo "/config.json: no Dash0 browser token, so browser monitoring is off (set the aks environment's DASH0_BROWSER_TOKEN secret)"
              return 1
            fi
            # Browser to nginx to discovery to Elasticsearch: a search through the public URL finds real sessions.
            if ! search=$(curl -sf --max-time 20 -X POST -H 'Content-Type: application/json' \
                -d '{"query":"observability"}' "$PUBLIC_URL/api/v1/search") \
              || ! jq -e '.results | length >= 1' <<<"$search" >/dev/null; then
              echo "/api/v1/search: no 200 with results"; return 1
            fi
            echo "$PUBLIC_URL serves the app, its config with the browser token, and $(jq '.results | length' <<<"$search") search results"
          }
          deadline=$((SECONDS + 300))
          until result=$(serves); do
            echo "$result"
            if ((SECONDS > deadline)); then echo "::error::$PUBLIC_URL$result"; exit 1; fi
            sleep 5
          done
          echo "$result"

      # One dash0.deployment event per service, after the deploy completed, successfully or not, as Dash0's deployment
      # event convention asks: scripts/dash0-deploy-marker.sh sends them. The failure marker handles deploy failures,
      # but not a failure to send the success marker itself. The token stays in the environment.
      - name: Mark the deploy in Dash0
        id: mark-succeeded
        env:
          DASH0_OTLP_URL: https://ingress.us-west-2.aws.dash0.com
          DASH0_AUTH_TOKEN: ${{ secrets.DASH0_INGEST_TOKEN }}
          DASH0_DATASET: conferenceops
        run: ./scripts/dash0-deploy-marker.sh succeeded "$TAG"

      - name: Mark the failed deploy in Dash0
        if: failure() && steps.mark-succeeded.outcome != 'failure'
        env:
          DASH0_OTLP_URL: https://ingress.us-west-2.aws.dash0.com
          DASH0_AUTH_TOKEN: ${{ secrets.DASH0_INGEST_TOKEN }}
          DASH0_DATASET: conferenceops
        run: ./scripts/dash0-deploy-marker.sh failed "$TAG"
