# Schema migrations run as a Job after install and before every upgrade, so new pods never start against an old
# schema. Additive MVP migrations only, so the previous app version keeps working while this runs (PLAN §14.5).
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "co.fullname" . }}-migrate
  labels:
    {{- include "co.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: post-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        {{- include "co.selector" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: migrate
          image: {{ include "co.image" . }}
          command: [alembic, -c, /app/alembic.ini, upgrade, head]
          env:
            {{- include "co.env" . | nindent 12 }}
          securityContext:
            {{- include "co.containerSecurity" . | nindent 12 }}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
