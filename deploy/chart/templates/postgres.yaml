# PostgreSQL, the canonical store. One replica on purpose: a demo, not HA (PLAN §16.2).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "co.fullname" . }}-postgres
  labels:
    {{- include "co.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ include "co.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "co.selector" . | nindent 6 }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        {{- include "co.selector" . | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          env:
            - {name: POSTGRES_USER, value: conferenceops}
            - {name: POSTGRES_DB, value: conferenceops}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ .Values.dbSecretName }}, key: password}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports:
            - {name: postgres, containerPort: 5432}
          readinessProbe:
            exec: {command: [pg_isready, -U, conferenceops, -d, conferenceops]}
            periodSeconds: 5
          securityContext:
            {{- include "co.containerSecurity" . | nindent 12 }}
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: run, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: {{ .Values.postgres.storage }}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "co.fullname" . }}-postgres
  labels:
    {{- include "co.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  selector:
    {{- include "co.selector" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}
