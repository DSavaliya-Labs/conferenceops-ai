# Defaults for every environment. deploy/env/aks/values.yaml overrides them for AKS.

image:
  repository: ""  # set by the deploy workflow: <registry>.azurecr.io/conferenceops-backend
  tag: ""         # the commit SHA; never `latest` (K8S-1)

environment: local

# One Deployment per process, from the same image.
components:
  core:
    command: core-api
    replicas: 1
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {memory: 512Mi}
  discovery:
    command: discovery-api
    replicas: 1
    # Admission control (DISCOVERY_MAX_INFLIGHT, 1..40): requests in progress per pod before discovery answers 503
    # DISCOVERY_CAPACITY_EXHAUSTED. Set it from measured capacity (ops/load/README.md), never in an incident PR (OPS-1).
    maxInflight: 8
    resources:
      requests: {cpu: 250m, memory: 256Mi}
      limits: {memory: 512Mi}
  worker:
    command: worker
    replicas: 1
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {memory: 768Mi}

# Incident fixes (OPS-1) may change discovery replicas only within these bounds; rendering fails outside them.
discoveryBounds:
  minReplicas: 1
  maxReplicas: 5

# The attendee web app, from apps/web: nginx (unprivileged, :8080) serves the Angular app and /config.json, and
# proxies /api to core and discovery in the release namespace.
web:
  image:
    repository: ""  # set by the deploy workflow: <registry>.azurecr.io/conferenceops-web
    tag: ""         # the commit SHA; never `latest` (K8S-1)
  replicas: 1
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 128Mi}
  # Browser monitoring (Dash0 Web SDK). The token is DASH0_BROWSER_TOKEN from secretName, ingest-only (SEC-1).
  dash0:
    endpoint: https://ingress.us-west-2.aws.dash0.com
    dataset: conferenceops

# The public entry point: an Azure LoadBalancer with a DNS name (<dnsLabel>.<region>.cloudapp.azure.com). Every node
# forwards it to a Ready web pod (externalTrafficPolicy Cluster in templates/public.yaml).
public:
  enabled: false
  dnsLabel: ""
  # The component that receives public traffic: the web app, which proxies /api to the APIs. helm-policy
  # (scripts/check-chart-policy.sh) fails the AKS render for any other.
  target: web

postgres:
  image: postgres:17.6
  storage: 5Gi
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {memory: 1Gi}

elasticsearch:
  version: 9.5.5
  storage: 10Gi
  heap: 1g
  resources:
    requests: {cpu: 500m, memory: 2Gi}
    limits: {memory: 3Gi}

# Secrets created outside the chart (by the deploy workflow): OPENAI_API_KEY, DASH0_INGEST_TOKEN, DASH0_BROWSER_TOKEN.
secretName: conferenceops-secrets
dbSecretName: conferenceops-db

# The OpenTelemetry Collector (subchart). It receives OTLP from the services and adds Kubernetes metadata, cluster
# metrics and Kubernetes events, then exports everything to Dash0's `conferenceops` dataset.
collector:
  fullnameOverride: conferenceops-collector
  mode: deployment
  image:
    repository: otel/opentelemetry-collector-contrib
  presets:
    kubernetesAttributes: {enabled: true}
    clusterMetrics: {enabled: true}
    kubernetesEvents: {enabled: true}
  extraEnvs:
    - name: DASH0_AUTH_TOKEN
      valueFrom:
        secretKeyRef: {name: conferenceops-secrets, key: DASH0_INGEST_TOKEN}
  config:
    exporters:
      otlphttp/dash0:
        endpoint: https://ingress.us-west-2.aws.dash0.com
        headers:
          Authorization: "Bearer ${env:DASH0_AUTH_TOKEN}"
          Dash0-Dataset: conferenceops
    service:
      pipelines:
        traces: {exporters: [otlphttp/dash0]}
        metrics: {exporters: [otlphttp/dash0]}
        logs: {exporters: [otlphttp/dash0]}
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities: {drop: [ALL]}
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {memory: 256Mi}
