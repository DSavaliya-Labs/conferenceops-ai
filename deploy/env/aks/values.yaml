# Values deployed to AKS. Incident pull requests may change only the discovery replicas or resources (OPS-1).

environment: aks

public:
  enabled: true
  dnsLabel: conferenceops-ai

components:
  discovery:
    replicas: 1
    # The per-pod admission limit, set from one pod's measured capacity (ops/load/README.md): C_pod = 64 requests/s
    # at about 0.38 s per request (p95 411 ms) on 2026-11-09, image 4da0ba2, so about 24 requests in progress by
    # Little's law. That leaves 16 of the 40 worker threads for the health probes, which must keep answering under
    # overload (the unlimited pod was restarted by its liveness probe at 96 requests/s). It stays the same through an
    # incident: an incident PR never changes it (OPS-1).
    maxInflight: 24
    resources:
      requests: {cpu: 250m, memory: 256Mi}
      limits: {memory: 512Mi}
