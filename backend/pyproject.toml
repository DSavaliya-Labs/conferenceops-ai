[project]
name = "conferenceops"
version = "0.1.0"
description = "ConferenceOps AI backend: the core API, the discovery API and the worker"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "elasticsearch>=9.0,<10",
  "openai>=1.50",
  "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8", "httpx2", "ruff>=0.6"]
media = ["pillow>=11"]  # scripts/cloudbridge_media.py only: the title slide of each replay clip

[project.scripts]
core-api = "conferenceops.core_app.main:run"
discovery-api = "conferenceops.discovery_app.main:run"
worker = "conferenceops.worker.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["conferenceops"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs real PostgreSQL and Elasticsearch (the data-integration CI job)"]
addopts = "-m 'not integration'"
